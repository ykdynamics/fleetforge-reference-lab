# Kept deliberately small. The lab has at most two hosts; a large Ansible configuration
# would be more to understand than the thing it configures.
[defaults]
host_key_checking = True
# The lab's own output is the evidence surface, so keep Ansible's terse and readable.
# result_format, not the old community.general.yaml stdout callback -- that plugin was
# removed in community.general 12, and selecting it makes every run fail to start.
result_format = yaml
display_skipped_hosts = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=10
