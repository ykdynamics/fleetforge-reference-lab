# Repository checks. These never contact a gateway.
#
# A green run here is NOT hardware qualification: the preflight scenarios run against
# an Ubuntu container, which has no device tree, no systemd and no USB. Checks that
# depend on those report UNKNOWN and can only be confirmed on a real Pi. See
# docs/evidence-conventions.md.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml ansible-core
          # Pinned rather than whatever the runner image ships. An older shellcheck
          # reported a finding a newer local one did not, which is a slow way to find out
          # that "lint passes" meant different things in two places.
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJf - --strip-components=1 -C /usr/local/bin shellcheck-v0.11.0/shellcheck
          pipx install ansible-lint

      - name: Shell syntax and lint
        run: |
          shellcheck --version | sed -n '2p'
          for f in scripts/*.sh; do
            case "$f" in
              */preflight-remote.sh) sh -n "$f" ;;   # POSIX sh, runs on the gateway
              *) bash -n "$f" ;;
            esac
          done
          shellcheck scripts/*.sh

      - name: Links and example files
        run: make check

      - name: Provisioning playbook syntax and lint
        run: |
          ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook \
            -i inventory/inventory.example.yml \
            --syntax-check ansible/playbooks/gateway-base.yml
          ansible-lint ansible/playbooks/gateway-base.yml

      - name: Provisioning guards and failure paths (simulated)
        run: make test-provision

      - name: Example inventory resolves as an Ansible inventory
        run: |
          ansible-inventory -i inventory/inventory.example.yml --list > /dev/null
          for host in lab-gw-zigbee lab-gw-zwave; do
            ansible-inventory -i inventory/inventory.example.yml --host "$host" > /dev/null
          done

      # The gateways are arm64; the runner is amd64. The scenarios deliberately
      # exercise both, so the runner needs arm64 emulation to run the primary ones.
      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Preflight scenarios and failure paths (simulated)
        run: make test-preflight
